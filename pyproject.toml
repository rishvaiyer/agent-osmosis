[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-osmosis"
version = "0.1.0"
description = "Cross-model learning transfer for expedited fine-tuning — ship the recipe, not the weights."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scikit-learn>=1.4"]

[project.optional-dependencies]
viz = ["matplotlib>=3.8", "plotly>=5.20", "streamlit>=1.40"]

[tool.setuptools.packages.find]
include = ["osmosis*"]
